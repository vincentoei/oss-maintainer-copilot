[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "oss-maintainer-copilot"
version = "0.1.0"
description = "A reviewable triage report for pytest issues"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13,<3",
    "mypy>=1.15,<3",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/maintainer_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
